# Everforest Dark Hard
# See ../colors.md — https://github.com/sainnhe/everforest

font_size 14.0

# Transparency. Adjust live with ctrl+shift+a then > / < , ctrl+shift+a 1 to reset.
background_opacity      0.92
dynamic_background_opacity yes
# macOS native blur; no-op on sway (needs SwayFX)
background_blur         32

# Without this, closing the last window leaves kitty running in the Dock.
macos_quit_when_last_window_closed yes

foreground              #d3c6aa
background              #1e2326
selection_foreground    #1e2326
selection_background    #d3c6aa

cursor                  #d3c6aa
cursor_text_color       #1e2326

url_color               #7fbbb3

active_tab_foreground   #1e2326
active_tab_background   #d3c6aa
inactive_tab_foreground #7a8478
inactive_tab_background #272e33

active_border_color     #7a8478
inactive_border_color   #272e33
bell_border_color       #ffe44d

